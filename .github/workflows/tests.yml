name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install numpy pytest ruff PySide6-Essentials
      - name: PySide6 loads (else test_gui_headless would be skipped)
        run: python -c "from PySide6 import QtWidgets"
      - name: Ruff
        run: ruff check --select E9,F,B006,B008 .
      - name: Pytest
        run: python -m pytest -q -rs
