<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8cdf0"/>
      <stop offset="0.5" stop-color="#7f8ce6"/>
      <stop offset="1" stop-color="#3f4aa0"/>
    </linearGradient>
  </defs>
  <!-- turned part: stepped cylinder seen from the side -->
  <path d="M6 22 H30 V16 H58 V48 H30 V42 H6 Z" fill="url(#g)" stroke="#1e2350" stroke-width="2" stroke-linejoin="round"/>
  <!-- spin arrow around the axis -->
  <path d="M10 12 A 22 6 0 0 1 54 10" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 10 l-7 -4 l1 8 z" fill="#2e7d32"/>
  <!-- insert at the shoulder -->
  <path d="M30 42 L38 58 L48 54 Z" fill="#e0a030" stroke="#5a3a00" stroke-width="2" stroke-linejoin="round"/>
  <!-- axis -->
  <path d="M2 32 H62" stroke="#1e2350" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
